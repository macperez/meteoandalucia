[project]
name = "meteoandalucia"
version = "0.1.0"
description = "Herramientas de datos meteorológicos de MeteoAndalucía."
readme = "README.md"
authors = [
    { name = "Manuel Castro", email = "macastrope@minsait.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
